name: Test
on:
  push:
    branches:
      - master
  pull_request: {}
env:
  MISE_EXPERIMENTAL: 1
  swift_package_resolve: swift package resolve
  swift_build: swift build
  swift_test: swift test
  periphery_scan: ./.build/debug/lethen scan --quiet --clean-build --strict --disable-update-check
  cache_version: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  swift-6-4:
    name: Swift 6.4 / Xcode 27
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify baseline
        run: bash .github/scripts/verify-swift-6.4.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-6.4-evidence
          path: .validation/
          include-hidden-files: true
  lint:
    runs-on: macos-26
    name: Lint
    steps:
      - uses: actions/checkout@master
      - uses: jdx/mise-action@v3
        with:
          cache: false
      - run: mise run lint-ci
      - name: Check generated Bazel rules
        run: mise r gen-bazel-rules && git diff --quiet --exit-code
  bazel:
      name: Bazel (${{ matrix.bazel }}, ${{ matrix.os }})
      strategy:
        fail-fast: false
        matrix:
          bazel: [8.x, 9.x]
          os: [macOS, Linux]
          include:
            - os: macOS
              runs-on: macos-26
              baseline: bazel.json
            - os: Linux
              runs-on: ubuntu-latest
              container: swift:latest
              cc: clang
              baseline: linux-bazel.json
      runs-on: ${{ matrix.runs-on }}
      container: ${{ matrix.container }}
      env:
        USE_BAZEL_VERSION: ${{ matrix.bazel }}
        CC: ${{ matrix.cc }}
      steps:
        - uses: actions/checkout@master
        - uses: bazel-contrib/setup-bazel@0.15.0
          with:
            bazelisk-version: 1.x
            bazelisk-cache: true
            disk-cache: bazel-${{ matrix.os }}-${{ matrix.bazel }}
            repository-cache: true
        - name: Scan
          run: bazel run //:periphery -- scan --bazel --quiet --strict --disable-update-check --baseline baselines/${{ matrix.baseline }}
  macOS:
    name: macOS
    strategy:
      fail-fast: false
      matrix:
        step: ["6.3", "6.2", "6.1"]
        include:
          - step: "6.3"
            xcode: "26.4"
            swiftly: ""
            macos: "macos-26"
          - step: "6.2"
            xcode: "26.3.0"
            swiftly: ""
            macos: "macos-26"
          - step: "6.1"
            xcode: "16.4"
            swiftly: ""
            macos: "macos-15"
    runs-on: ${{ matrix.macos }}
    steps: &macos-steps
    - uses: actions/checkout@master
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Install Swiftly
      if: ${{ matrix.swiftly }}
      run: |
        curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
        installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
        ~/.swiftly/bin/swiftly init --skip-install
        . ~/.swiftly/env.sh
        hash -r
        echo "PATH=$PATH" >> "$GITHUB_ENV"
        echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
        echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
    - name: Install Swift (Swiftly)
      if: ${{ matrix.swiftly }}
      run: swiftly install ${{ matrix.swiftly }} --use
    - name: Get Swift Version
      id: get-swift-version
      run: |
        swift_version=$(swift -version | head -n 1 | sed s/,//)
        echo "$swift_version"
        echo "SWIFT_VERSION=${swift_version}" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache resolved dependencies
      id: cache-resolved-dependencies
      uses: actions/cache@v4
      with:
        path: |
          .build
          Package.resolved
        key: ${{ runner.os }}-${{ matrix.xcode }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.xcode }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-
    - name: Resolve dependencies
      if: steps.cache-resolved-dependencies.outputs.cache-hit != 'true'
      run: ${{ env.swift_package_resolve }}
    - name: Build
      run: ${{ env.swift_build }}
    - name: Scan
      run: ${{ env.periphery_scan }} ${{ matrix.baseline && format('--baseline baselines/{0}', matrix.baseline) || '' }}
    - name: Test
      run: ${{ env.swift_test }}
  linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.2", "6.1"]
        include:
          - swift: "6.3"
            container: "swift:6.3"
          - swift: "6.2"
            container: "swift:6.2"
          - swift: "6.1"
            container: "swift:6.1"
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps: &linux-steps
    - uses: actions/checkout@master
    - name: Get Swift Version
      id: get-swift-version
      run: |
        swift_version=$(swift -version | head -n 1 | sed s/,//)
        echo "$swift_version"
        echo "SWIFT_VERSION=${swift_version}" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache resolved dependencies
      id: cache-resolved-dependencies
      uses: actions/cache@v4
      with:
        path: |
          .build
          Package.resolved
        key: ${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-
    - name: Resolve dependencies
      if: steps.cache-resolved-dependencies.outputs.cache-hit != 'true'
      run: ${{ env.swift_package_resolve }}
    - name: Build
      run: ${{ env.swift_build }}
    - name: Scan
      run: ${{ env.periphery_scan }} --baseline baselines/linux.json
    - name: Verify update check teardown
      run: bash .github/scripts/verify-update-check-teardown.sh ./.build/debug/lethen 15
    - name: Test
      run: ${{ env.swift_test }}
  # Nightly toolchains run the same steps but are allowed to fail, so they are separate
  # jobs outside the required gate below.
  macOS-nightly:
    name: macOS (${{ matrix.step }})
    strategy:
      fail-fast: false
      matrix:
        step: ["main-snapshot"]
        include:
          - step: "main-snapshot"
            xcode: "26.4"
            swiftly: "main-snapshot"
            macos: "macos-26"
    runs-on: ${{ matrix.macos }}
    continue-on-error: true
    steps: *macos-steps
  linux-nightly:
    name: Linux (${{ matrix.swift }})
    strategy:
      fail-fast: false
      matrix:
        swift: ["main-snapshot"]
        include:
          - swift: "main-snapshot"
            container: "swiftlang/swift:nightly-main"
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    continue-on-error: true
    steps: *linux-steps
  required:
    # The single check branch protection requires. `needs` holds each dependency's latest
    # result, including across partial reruns, and a matrix job succeeds only if all of its
    # entries do. The gate fails unless every expected dependency is present and succeeded.
    name: Required checks
    if: always()
    needs: [swift-6-4, lint, bazel, macOS, linux]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Verify job results
      env:
        NEEDS: ${{ toJSON(needs) }}
        # Keep in sync with `needs` above; a mismatch fails the gate.
        EXPECTED: '["bazel", "linux", "lint", "macOS", "swift-6-4"]'
      run: |
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'

        if ! echo "$NEEDS" | jq -e --argjson expected "$EXPECTED" \
          '(keys | sort) == ($expected | sort) and all(.[]; .result == "success")' > /dev/null; then
          echo "::error::Every required job must be present and succeed."
          exit 1
        fi
