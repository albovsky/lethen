name: Test
on:
  push:
    branches:
      - master
  pull_request: {}
  schedule:
    # Nightly toolchains and the full stable matrix, once a day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Which jobs to run (see .github/scripts/plan-ci.sh)
        type: choice
        options: [nightly, master, pr]
        default: nightly
env:
  MISE_EXPERIMENTAL: 1
  swift_package_resolve: swift package resolve
  swift_build: swift build
  swift_test: swift test
  periphery_scan: ./.build/debug/lethen scan --quiet --clean-build --strict --disable-update-check
  cache_version: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  # Hosted macOS runs at most five jobs at once for the whole account, so pull requests
  # only build the newest stable toolchain per platform (`pr` profile): Swift 6.4 / Xcode 27
  # on macOS, Swift 6.3 and 6.4 on Linux. Pushes to master run every stable toolchain,
  # adding macOS 6.3 / Xcode 26.4 and Bazel 8.x (`master`), and the nightly schedule adds
  # the main-snapshot toolchains (`nightly`). Snapshot toolchains are informational and
  # allowed to fail, so they never run on pushes or pull requests. Documentation-only
  # changes skip the build jobs entirely.
  #
  # Every job sets `timeout-minutes` to at least twice its longest successful run as of
  # 2026-09-30, and never under 10 minutes, so a hung build or test fails within the hour
  # instead of holding a runner for GitHub's default of six hours. Raise a limit when a
  # job legitimately grows. `linux-release` sets its own limits in release-linux.yml.
  changes:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      code: ${{ steps.plan.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: bash .github/scripts/plan-ci.sh
  swift-6-4:
    name: Swift 6.4 / Xcode 27
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Get Swift Version
        run: |
          swift_version=$(swift -version | head -n 1 | sed s/,//)
          echo "$swift_version"
          echo "SWIFT_VERSION=${swift_version}" >> "$GITHUB_ENV"
      # Both caches use exact keys with no fallback: the baseline either starts from the
      # products this exact dependency set and fixture set produced under this toolchain,
      # or from nothing. The strict self-scan still performs its own managed clean build.
      - name: Cache resolved dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Package.resolved
          key: ${{ runner.os }}-27.0-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Cache Xcode fixture builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/com.github.peripheryapp
          key: ${{ runner.os }}-27.0-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-xcode-fixtures-${{ hashFiles('Tests/XcodeTests/**', 'Sources/XcodeSupport/**') }}
      - name: Verify baseline
        run: bash .github/scripts/verify-swift-6.4.sh
      - name: Check generated Bazel rules
        # The generator reads `swift package describe`, whose manifest only includes the
        # Xcode targets on macOS, so this check needs a macOS toolchain. It runs here because
        # this is the one macOS SwiftPM job every profile runs. The baseline above pins the
        # pull request head, but the rules must match what merging produces, so on a pull
        # request this step regenerates them in a separate worktree of the merge commit, as
        # the macOS job's default checkout did. The worktree keeps the cached .build and
        # Package.resolved at the head.
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$MERGE_SHA"
            git worktree add --detach "$RUNNER_TEMP/merge" FETCH_HEAD
            cd "$RUNNER_TEMP/merge"
          fi
          ruby .mise/tasks/scripts/gen_bazel_rules.rb && git diff --quiet --exit-code -- Sources/BUILD.bazel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: swift-6.4-evidence
          path: .validation/
          include-hidden-files: true
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Formatting, SwiftLint and buildifier need no Apple toolchain, so this runs on
    # Linux and stays out of the macOS queue. The generated Bazel rules are checked in
    # the macOS job because the generator needs the macOS package manifest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          repository-cache: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - run: mise run lint-ci
  bazel:
    # Job names stay static: GitHub appends the matrix values itself, and a skipped matrix
    # job would otherwise show its name with the expressions unexpanded.
    name: Bazel
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        bazel: [9.x]
        os: [macOS, Linux]
        include: &bazel-platforms
          - os: macOS
            runs-on: macos-26
            baseline: bazel.json
          - os: Linux
            runs-on: ubuntu-24.04
            container: swift:latest
            cc: clang
            baseline: linux-bazel.json
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    env: &bazel-env
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      CC: ${{ matrix.cc }}
    steps: &bazel-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true
          disk-cache: bazel-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      - name: Scan
        run: bazel run //:periphery -- scan --bazel --quiet --strict --disable-update-check --baseline baselines/${{ matrix.baseline }}
  bazel-extended:
    name: Bazel
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.profile != 'pr'
    strategy:
      fail-fast: false
      matrix:
        bazel: [8.x]
        os: [macOS, Linux]
        include: *bazel-platforms
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    env: *bazel-env
    steps: *bazel-steps
  macOS:
    # The previous Xcode major. Pull requests leave it out: Swift 6.4 / Xcode 27 covers macOS
    # and Linux 6.3 covers the Swift 6.3 compiler, and this job was the longest on a pull
    # request (about 15 minutes). A break specific to Xcode 26.4 shows on the push to master;
    # to catch it before merging, run this workflow on the branch with the `master` profile.
    name: macOS
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.profile != 'pr'
    strategy:
      fail-fast: false
      matrix:
        step: ["6.3"]
        include:
          - step: "6.3"
            xcode: "26.4"
            swiftly: ""
            macos: "macos-26"
    runs-on: ${{ matrix.macos }}
    timeout-minutes: 45
    steps: &macos-steps
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
    - name: Install Swiftly
      if: ${{ matrix.swiftly }}
      run: |
        curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
        installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
        ~/.swiftly/bin/swiftly init --skip-install
        . ~/.swiftly/env.sh
        hash -r
        echo "PATH=$PATH" >> "$GITHUB_ENV"
        echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
        echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"
    - name: Install Swift (Swiftly)
      if: ${{ matrix.swiftly }}
      run: |
        swiftly install ${{ matrix.swiftly }} --use
        # Since swiftly 1.2.0 its proxies export TOOLCHAINS, which reaches the
        # xcodebuild calls in XcodeTests and breaks package manifest linking.
        # Call the toolchain directly so xcodebuild keeps the selected Xcode.
        echo "$(swiftly use --print-location)/usr/bin" >> "$GITHUB_PATH"
    - name: Get Swift Version
      id: get-swift-version
      run: |
        swift_version=$(swift -version | head -n 1 | sed s/,//)
        echo "$swift_version"
        echo "SWIFT_VERSION=${swift_version}" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache resolved dependencies
      id: cache-resolved-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build
          Package.resolved
        key: ${{ runner.os }}-${{ matrix.xcode }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.xcode }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-
    - name: Resolve dependencies
      if: steps.cache-resolved-dependencies.outputs.cache-hit != 'true'
      run: ${{ env.swift_package_resolve }}
    - name: Cache Xcode fixture builds
      # XcodeTests build the UIKit and SwiftUI fixture projects with xcodebuild into the
      # lethen cache directory. The exact key has no fallback, so any fixture or Xcode
      # change rebuilds from scratch and a restored build is always the one these sources
      # produced.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/com.github.peripheryapp
        key: ${{ runner.os }}-${{ matrix.xcode }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-xcode-fixtures-${{ hashFiles('Tests/XcodeTests/**', 'Sources/XcodeSupport/**') }}
    - name: Build
      run: ${{ env.swift_build }}
    # Test runs before Scan so it extends the cached incremental build. The scan's managed
    # clean build would otherwise force `swift test` to recompile the whole tree.
    - name: Test
      run: ${{ env.swift_test }}
    - name: Scan
      run: ${{ env.periphery_scan }} ${{ matrix.baseline && format('--baseline baselines/{0}', matrix.baseline) || '' }}
  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.4", "6.3"]
        include:
          - swift: "6.4"
            container: "swift:6.4"
          - swift: "6.3"
            container: "swift:6.3"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ matrix.container }}
    steps: &linux-steps
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Get Swift Version
      id: get-swift-version
      run: |
        swift_version=$(swift -version | head -n 1 | sed s/,//)
        echo "$swift_version"
        echo "SWIFT_VERSION=${swift_version}" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache resolved dependencies
      id: cache-resolved-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build
          Package.resolved
        key: ${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-${{ hashFiles('Package.swift', 'Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ env.cache_version }}-spm-deps-
    - name: Resolve dependencies
      if: steps.cache-resolved-dependencies.outputs.cache-hit != 'true'
      run: ${{ env.swift_package_resolve }}
    - name: Build
      run: ${{ env.swift_build }}
    - name: Verify update check teardown
      run: bash .github/scripts/verify-update-check-teardown.sh ./.build/debug/lethen 15
    # Test runs before Scan so it extends the cached incremental build. The scan's managed
    # clean build would otherwise force `swift test` to recompile the whole tree.
    - name: Test
      run: ${{ env.swift_test }}
    - name: Scan
      run: ${{ env.periphery_scan }} --baseline baselines/linux.json
  # Nightly toolchains run the same steps but are allowed to fail, so they only run on the
  # nightly profile and stay outside the required gate below.
  macOS-nightly:
    name: macOS nightly
    needs: changes
    if: needs.changes.outputs.profile == 'nightly'
    strategy:
      fail-fast: false
      matrix:
        step: ["main-snapshot"]
        include:
          - step: "main-snapshot"
            xcode: "26.4"
            swiftly: "main-snapshot"
            macos: "macos-26"
    runs-on: ${{ matrix.macos }}
    timeout-minutes: 60
    continue-on-error: true
    steps: *macos-steps
  linux-nightly:
    name: Linux nightly
    needs: changes
    if: needs.changes.outputs.profile == 'nightly'
    strategy:
      fail-fast: false
      matrix:
        swift: ["main-snapshot"]
        include:
          - swift: "main-snapshot"
            container: "swiftlang/swift:nightly-main"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: ${{ matrix.container }}
    continue-on-error: true
    steps: *linux-steps
  corpus:
    # Scans every pinned precision-corpus project and fails on any finding that differs from
    # its committed expectation (corpus/expected/), so analysis drift is adjudicated rather
    # than merged unnoticed. Only checkouts are cached; each project's .build would crowd
    # the repository cache quota described under prune-caches.
    name: Precision corpus
    needs: changes
    if: needs.changes.outputs.profile == 'nightly'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache corpus checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .corpus/checkouts
            !.corpus/checkouts/*/.build
          key: corpus-checkouts-${{ hashFiles('corpus/projects.json') }}
      - run: swift build --product lethen
      - name: Scan and diff every project
        run: |
          set -euo pipefail
          status=0
          for name in $(python3 -c 'import json; print("\n".join(e["name"] for e in json.load(open("corpus/projects.json"))))'); do
            corpus/scan.sh "$name"
            corpus/diff.sh "$name" || status=1
          done
          exit $status
      # The scorecard from the committed expectations and verdicts, so the published figure and
      # the sampled findings that still need a verdict are visible on every run.
      - name: Summarize precision
        if: always()
        run: python3 corpus/precision.py --markdown --stdout >> "$GITHUB_STEP_SUMMARY"
      # A sampled finding without a verdict fails the job the way unadjudicated drift does, so
      # the published figure never covers only part of the sample.
      - name: Require a verdict for every sampled finding
        if: always()
        run: python3 corpus/precision.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: corpus-results
          path: .corpus/results
          include-hidden-files: true
  prune-caches:
    # Caches saved by merged or closed pull requests and deleted branches are never
    # restored again, but they count against the 10 GB repository quota until GitHub
    # evicts them, and eviction is least-recently-used across the whole repository, so
    # live caches go with them and warm jobs turn cold at random. This runs nightly, and
    # on manual runs so it can be exercised from a branch.
    name: Prune caches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/prune-caches.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
  linux-release:
    # The Linux release tarballs, built and smoke-tested exactly as the Release workflow
    # builds them, so a change that breaks them fails here rather than after a tag.
    name: Linux release
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/release-linux.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read
  required:
    # The single check branch protection requires. `needs` holds each dependency's latest
    # result, including across partial reruns, and a matrix job succeeds only if all of its
    # entries do. Every expected dependency must be present with exactly the result the
    # profile calls for: success when it was meant to run, skipped when it was not.
    name: Required checks
    if: always()
    needs: [changes, swift-6-4, lint, bazel, bazel-extended, macOS, linux, linux-release, corpus]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
    - name: Verify job results
      env:
        NEEDS: ${{ toJSON(needs) }}
        PROFILE: ${{ needs.changes.outputs.profile }}
        CODE: ${{ needs.changes.outputs.code }}
        # Keep in sync with `needs` above; a mismatch fails the gate.
        CORE: '["changes", "swift-6-4", "lint", "bazel", "linux", "linux-release"]'
        EXTENDED: '["bazel-extended", "macOS"]'
        NIGHTLY: '["corpus"]'
      run: |
        echo "profile=$PROFILE code=$CODE"
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'

        if ! echo "$NEEDS" | jq -e --argjson core "$CORE" --argjson extended "$EXTENDED" \
          --argjson nightly "$NIGHTLY" --arg code "$CODE" --arg profile "$PROFILE" '
          def expected($job):
            if $job == "changes" then "success"
            elif ($core | index($job)) != null then
              (if $code == "true" then "success" else "skipped" end)
            elif ($nightly | index($job)) != null then
              (if $profile == "nightly" then "success" else "skipped" end)
            else
              (if $code == "true" and $profile != "pr" then "success" else "skipped" end)
            end;
          (keys | sort) == (($core + $extended + $nightly) | sort)
            and all(to_entries[]; .value.result == expected(.key))' > /dev/null; then
          echo "::error::Every required job must be present with the result its profile expects."
          exit 1
        fi
